version: "3.8"
# 本地开发依赖:MySQL 8 + Redis(含 RediSearch,供 RAG 向量索引)+ deviceSimulator
# deviceSimulator 为外部已有服务(2026-08-27 澄清:本项目不开发模拟器本体);
# 镜像经 SIMULATOR_IMAGE 环境变量指定(模拟器项目自行构建/发布),
# 接口契约见仓库根《后端接口说明.md》(默认 :8081,无认证)
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: autosense
      MYSQL_USER: autosense
      MYSQL_PASSWORD: autosense
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis/redis-stack-server:latest
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  device-simulator:
    image: ${SIMULATOR_IMAGE:-devicesimulator:latest}
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  mysql-data:
  redis-data:
