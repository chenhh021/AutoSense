spring:
  application:
    name: AutoSense
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/autosense?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
      # schema/data 初始化失败必须使启动失败，禁止静默跳过迁移或约束错误。
      continue-on-error: false

mybatis-flex:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

server:
  port: 8180
# springdoc-openapi(注意:Controller 自带 /api/v1 前缀,不要再加 context-path,
# 否则实际路径变成 /api/api/v1/...,与契约/前端不符)
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.chh.autosense.controller
# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn


# ===== AutoSense 外部服务配置(章程原则 V:全部经环境变量注入,禁止硬编码凭据)=====
autosense:
  cors:
    # 浏览器前端来源白名单，逗号分隔；生产环境必须用实际 HTTPS 站点覆盖
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8080,http://127.0.0.1:3000,http://127.0.0.1:5173,http://127.0.0.1:8080}
    # 浏览器缓存预检结果的时间（秒）
    max-age-seconds: ${CORS_MAX_AGE_SECONDS:3600}
  llm:
    base-url: ${LLM_BASE_URL:https://token-plan.cn-beijing.maas.aliyuncs.com/compatible-mode/v1}
    api-key: ${LLM_API_KEY:}
    model-name: ${LLM_MODEL_NAME:qwen3.8-max}
    temperature: ${LLM_TEMPERATURE:0.2}
    timeout-seconds: ${LLM_TIMEOUT_SECONDS:360}
    # 仅支持 mock/real；当前默认使用真实 LangChain4j 模型，本地桩请显式设置 LLM_MODE=mock
    mode: ${LLM_MODE:real}
  device-service:
    # deviceSimulator(外部已有服务,接口契约见仓库根《后端接口说明.md》;2026-08-27 起为唯一设备交互实现)
    base-url: ${DEVICE_SERVICE_BASE_URL:http://localhost:8080}
    timeout-seconds: ${DEVICE_SERVICE_TIMEOUT_SECONDS:10}
  aftersales:
    base-url: ${AFTERSALES_BASE_URL:}
    api-key: ${AFTERSALES_API_KEY:}
    default-radius-meters: ${AFTERSALES_RADIUS:10000}
    timeout-seconds: ${AFTERSALES_TIMEOUT_SECONDS:5}
    # 本期网点查询为项目内固定 mock 数据(2026-08-22 澄清;后续以地图搜索工具替换实现)
    mock-enabled: ${AFTERSALES_MOCK_ENABLED:true}
    # 位置不可用/查询失败时的官方客服兜底
    official-hotline-name: ${AFTERSALES_OFFICIAL_NAME:品牌官方客服}
    official-hotline-phone: ${AFTERSALES_OFFICIAL_PHONE:400-000-0000}
  auth:
    issuer-uri: ${AUTH_ISSUER_URI:}
    # dev 模式接受 "user-{id}" 形式令牌;真实令牌优先解析(R21)。⚠️ 生产必须 false
    dev-mode: ${AUTH_DEV_MODE:true}
    # 登录令牌滚动 TTL(天),存 Redis autosense:token:{token}(R19)
    token-ttl-days: ${AUTH_TOKEN_TTL_DAYS:7}
  chat-memory:
    # LLM 端对话记忆窗口(FR-018):最近 N 条消息;超出部分仍长期留存于 MySQL 可查
    window: ${CHAT_MEMORY_WINDOW:20}
  rag:
    # Redis 向量索引(research R4;索引型数据,显式重建,TTL 例外已论证)
    embeddings-enabled: ${RAG_EMBEDDINGS_ENABLED:false}
    index-prefix: 'autosense:rag:'
    top-k: 3
  # 受支持设备类型注册表(FR-004/FR-012):新增设备类型仅需在此注册 + 新增 Adapter Bean
  # 本期仅智能灯泡(对应 deviceSimulator LITE:LA001/LB001;2026-08-27 澄清暂停多类型)
  # fault-rules:状态→故障判定(R12),按序匹配首个命中;结论类型
  #   AUTO_REPAIRABLE(经 action+params 自动修复)/ MANUAL_ONLY(人工步骤)/
  #   AFTERSALES(售后)/ 无命中 = NORMAL(无异常)
  device-types:
    smart_bulb:
      display-name: 智能灯泡
      supported: true
      simulator-type-code: LITE
      models:
        LA001:
          display-name: 单色灯泡
          state-fields: [ brightness, color_temperature ]
          commands: [ set_brightness, set_color_temperature ]
        LB001:
          display-name: 彩光灯泡
          state-fields: [ brightness, color ]
          commands: [ set_brightness, set_color ]
      # 探测(读 state)免确认;下列命令均为改变设备状态的操作,必经用户确认(FR-008)
      fault-rules:
        - name: 设备已停止
          when: "running_status == 'stopped'"
          conclusion: AUTO_REPAIRABLE
          action: start
          reason: 设备当前处于停止状态,启动即可恢复
        - name: 亮度过低
          when: "brightness < 5"
          conclusion: AUTO_REPAIRABLE
          action: set_brightness
          params: { brightness: 80 }
          reason: 检测到亮度接近 0,调整亮度即可恢复
        - name: 硬件故障
          when: "hardware_fault == true"
          conclusion: MANUAL_ONLY
          knowledge-ref: 硬件故障
          reason: 检测到硬件故障标志,需人工处理
        - name: 色温异常偏高
          when: "color_temperature >= 6400"
          conclusion: MANUAL_ONLY
          knowledge-ref: 色温异常
          reason: 色温漂移超出远程调节范围,需人工检查
        - name: 未知异常
          when: "error != null"
          conclusion: AFTERSALES
          reason: 设备上报未知错误,无法确定远程修复步骤
